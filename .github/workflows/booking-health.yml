name: Booking health monitor

on:
  schedule:
    # Daily 15:00 UTC (~9 AM MT) — low-volume alert: pings only if 0 paid bookings in 72h.
    - cron: '0 15 * * *'
    # Monday 15:30 UTC — weekly funnel snapshot (started vs paid, conversion).
    - cron: '30 15 * * 1'
  # Manual trigger — pick which check to run (defaults to daily).
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which check to run'
        type: choice
        options:
          - daily
          - weekly
        default: daily

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: booking-health
      cancel-in-progress: false

    steps:
      - name: Fire booking-health cron
        run: |
          # Weekly if the Monday schedule fired OR a manual run picked "weekly".
          QS=""
          if [ "${{ github.event.schedule }}" = "30 15 * * 1" ] || [ "${{ inputs.mode }}" = "weekly" ]; then
            QS="?weekly=1"
          fi
          echo "Calling booking-health${QS}"
          RESP=$(curl -sS -w $'\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fullthrottleutah.com/api/cron/booking-health${QS}")
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -n1)
          echo "HTTP $CODE"
          echo "Response: $BODY"
          # Fail the run on a non-2xx so a broken monitor is visible in Actions.
          [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]
